  <!-- Embedded iframe but spoofed to same-origin -->
  <iframe id="g" style="display:block"></iframe>

  <script>
    const hijackUrl = "https://monster-adventure.game-files.crazygames.com/gameframe/up-aps/aps-script-1.4.20.html?game_slug=monster-adventure&apsType=unity&unityRawIDBId=https://monster-adventure.game-files.crazygames.com/unity/unity2020";

    const f = document.getElementById("g");
    f.src = hijackUrl;

    f.onload = () => {
      const swCode = `
        self.addEventListener('fetch', event => {
          const url = new URL(event.request.url);

          // Spoof headers to make assets load successfully
          const newHeaders = new Headers(event.request.headers);
          newHeaders.set('Origin', 'https://www.crazygames.com');
          newHeaders.set('Referer', 'https://www.crazygames.com/');

          const newReq = new Request(url, {
            method: event.request.method,
            headers: newHeaders,
            mode: 'cors',
            credentials: 'include'
          });

          event.respondWith(fetch(newReq));
        });

        self.addEventListener('activate', () => self.clients.claim());
      `;

      const blob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(blob);

      f.contentWindow.navigator.serviceWorker.register(swUrl, { scope: '/' })
        .then(() => console.log("✅ Service Worker registered"))
        .catch(err => console.warn("❌ SW failed", err));
    };
  </script>
